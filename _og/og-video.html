<!DOCTYPE html>
<html lang="en">
<head>
<!-- Source for the site's share video (og:video): the share image, with two
     friends' cursors moving, going still, and fading away the way the app does
     (fade in .3s, fade out 1s after 5s still, from PointerPalsConfig.swift).
     A 12-second loop that opens and closes on the share image. Open it in a
     browser to watch it loop; re-render the video with ./render-video.sh -->
<meta charset="utf-8">
<title>PointerPals share video</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=block">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #ffffff;
    color: #1d1d1f;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Inter, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    position: relative;
  }
  .copy {
    position: absolute; left: 88px; top: 0; bottom: 0; width: 560px;
    display: flex; flex-direction: column; justify-content: center; gap: 26px;
  }
  .app { display: flex; align-items: center; gap: 22px; }
  .app img { width: 84px; height: 84px; border-radius: 19px; box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 6px 18px rgba(0,0,0,.10); }
  .app span { font-size: 40px; font-weight: 700; letter-spacing: -0.01em; }
  h1 {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Inter, "Helvetica Neue", Arial, sans-serif;
    font-size: 60px; font-weight: 700;
    line-height: 1.02; letter-spacing: -0.03em;
    text-wrap: balance;
  }
  .pitch { font-size: 25px; line-height: 1.38; color: #55555b; font-weight: 500; max-width: 500px; }
  .note { font-size: 19px; font-weight: 600; color: #55555b; opacity: .8; margin-top: -12px; }
  .sig { width: 214px; height: auto; color: #1d1d1f; margin-top: 6px; }

  /* iPhone, cropped by the bottom edge like the NYC Parking preview */
  .phone {
    position: absolute; left: 690px; top: 52px; width: 418px; height: 900px;
    border-radius: 72px; padding: 14px;
    background: #1c1c1e;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.08), 0 0 0 1.5px rgba(0,0,0,.35), 0 30px 60px rgba(0,0,0,.18);
  }
  .screen { position: relative; width: 100%; height: 100%; border-radius: 58px; overflow: hidden; background: #000; }
  .screen img { width: 100%; display: block; }
  .island { position: absolute; top: 14px; left: 50%; width: 118px; height: 34px; margin-left: -59px; border-radius: 17px; background: #000; }

  /* Mac: the two screens bleed off the right edge */
  .mac { position: absolute; left: 672px; top: 110px; width: 600px; }
  .macs { width: 100%; display: block; filter: drop-shadow(0 24px 40px rgba(0,0,0,.12)); }
  .cur { position: absolute; width: 34px; filter: drop-shadow(0 2px 3px rgba(0,0,0,.25)); }
  .cur { left: 0; top: 0; will-change: transform, opacity; }
</style>
</head>
<body>
  <div class="copy">
    <div class="app"><img src="icon.png" alt=""><span>PointerPals</span></div>
    <h1>See your friends.<br>Stay focused.</h1>
    <p class="pitch">Your friends’ cursors show up on your screen while they work, and fade away when they go still.</p>
    <p class="note">For Mac</p>
    <!-- The same signature as the site footers and the other previews -->
    <svg class="sig" aria-label="App by Jon Bobrow" viewBox="0 0 3087.29 681.93" fill="none" stroke="currentColor" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"><path d="M1610.11,335.11c0,17.82,19.8,77.22,3.96,110.89M15,537.47C23.66,136.35,107.34,18.04,136.2,15.15c28.86-2.89,86.57,31.74,86.57,484.8M80.58,356.55c65.34-37.62,178.21-25.74,178.21-25.74M320.17,330.81c81.18-15.84,176.23,73.26,47.52,142.57M466.7,328.83c81.18-15.84,160.39,71.28,67.32,134.65M353.83,396.15c-5.94,104.95,29.7,241.57,29.7,241.57M490.46,378.33c-5.94,104.95,13.86,211.87,13.86,211.87M788.37,148.98c-11.88,49.5-26.16,130.64-33.66,199.99-7.92,73.26,38.68,123.77,86.2,90.1s12.8-101.98-40.66-98.06M923.02,537.08c-35.64,27.72-53.4,109.67,2.96,126.69,69.81,21.08,80.2-67.28,76.24-138.57s-19.8-194.05-19.8-194.05M982.42,331.15c1.98,75.24-9.9,118.81-51.48,110.89s-31.68-85.14-23.76-128.71M1388.34,55.92c29.7,142.57,55.95,373.41-47.52,407.9-71.28,23.76-100.98-51.48-93.06-83.16M1507.15,321.25c-45.54-3.96-56.51,138.61,9.9,138.61,73.26,0,47.85-133.59-9.9-138.61ZM2225.92,343.03c-72.62,9.68-56.39,142.67,9.9,138.61,97.02-5.94,49.5-146.53-9.9-138.61ZM2686.12,343.13c-64.18-8.02-87.35,95.19-26.56,112.77,66.28,19.16,73.26-106.93,26.56-112.77ZM1614.07,445.99c19.8-85.14,41.58-116.83,55.44-116.83s37.62,108.91,73.26,128.71M1934.85,172.74c47.52-45.54,186.13-25.74,194.05,33.66,7.92,59.4-39.6,97.02-37.62,122.77s56.36,69.3,38.54,120.79-66.26,57.42-137.55,25.74M2002.17,198.48c-5.94,47.52-1.98,209.89,7.92,241.57M2352.65,182.64c-7.92,55.44-9.84,280.18,67.32,277.21,51.48-1.98,57.42-116.83-17.82-122.77M2590.26,305.41c-35.64,13.86-59.4,27.56-59.4,134.65,0,9.9-15.84-93.06-19.8-116.83M2881.33,392.53s-9.9,67.32,39.6,65.34c69.28-2.77,130.89-59.33,148.51-138.61,15.84-71.28-39.6-83.16-39.6-83.16M2778.37,360.85c-7.92,49.5-1.85,92.77,17.82,95.04,51.48,5.94,85.14-63.36,85.14-63.36"/></svg>
  </div>
  <div class="mac">
      <img class="macs" src="screen.png" alt="">
      <img class="cur c1" src="cursor@2x.png" alt="">
      <img class="cur c2" src="cursor@2x.png" alt="">
    </div>
  <script>
  // Each friend: where the cursor goes and when, in seconds and in .mac pixels.
  // A move is [start, end, to, bend]; bend bows the path sideways like a hand does.
  // Between moves the cursor is still; 5s still and it fades out over 1s, and it
  // fades back in over .3s as soon as it moves again.
  const T = 12, IDLE = 5, FADE_OUT = 1, FADE_IN = .3;
  const friends = [
    { el: document.querySelector('.c1'), from: [150, 190], moves: [
      [.6, 1.3, [232, 118], 18], [1.35, 1.6, [226, 124], 0], [1.9, 2.4, [258, 108], -10], [2.45, 2.8, [250, 112], 0],
      [9.6, 10.6, [170, 176], 25], [10.7, 11.4, [150, 190], -6],
    ]},
    { el: document.querySelector('.c2'), from: [420, 120], moves: [
      [2.0, 2.7, [372, 212], -20], [2.8, 3.05, [392, 236], 6], [3.1, 3.35, [362, 248], -6], [3.4, 3.65, [384, 262], 5],
      [3.7, 4.4, [350, 250], -8], [10.8, 11.6, [408, 140], 20], [11.65, 11.95, [420, 120], 0],
    ]},
  ];

  const ease = (u) => u * u * u * (10 + u * (6 * u - 15));   // minimum-jerk, like a reach

  function place(f, t) {
    let at = f.from, lastEnd = -Infinity, firstStart = f.moves[0][0];
    for (const [a, b, to, bend] of f.moves) {
      if (t < a) break;
      if (t <= b) {
        const u = ease((t - a) / (b - a));
        const [x0, y0] = at, [x1, y1] = to;
        const dx = x1 - x0, dy = y1 - y0, len = Math.hypot(dx, dy) || 1;
        const k = bend * 4 * u * (1 - u);              // sideways bow, zero at both ends
        return { p: [x0 + dx * u - dy / len * k, y0 + dy * u + dx / len * k], moving: true };
      }
      at = to; lastEnd = b;
    }
    // Still since the last move ended (wrapping round the loop for the opening stretch)
    const since = lastEnd === -Infinity ? t + T - f.moves.at(-1)[1] : t - lastEnd;
    return { p: at, moving: false, since };
  }

  function opacity(f, t) {
    // Walk the timeline: fully shown while moving or < 5s still; fading after
    const s = place(f, t);
    if (s.moving) {
      // Coming back from faded: fade in over .3s from the start of this move
      const move = f.moves.find(([a, b]) => t >= a && t <= b);
      const prevEnd = f.moves.indexOf(move) ? f.moves[f.moves.indexOf(move) - 1][1] : f.moves.at(-1)[1] - T;
      const wasGone = move[0] - prevEnd > IDLE;
      return wasGone ? Math.min(1, (t - move[0]) / FADE_IN) : 1;
    }
    return s.since < IDLE ? 1 : Math.max(0, 1 - (s.since - IDLE) / FADE_OUT);
  }

  window.seek = (time) => {
    const t = ((time % T) + T) % T;
    for (const f of friends) {
      const [x, y] = place(f, t).p;
      f.el.style.transform = `translate(${x.toFixed(2)}px, ${y.toFixed(2)}px)`;
      f.el.style.opacity = opacity(f, t).toFixed(3);
    }
  };
  seek(0);
  // In a browser, play it; the recorder calls seek() itself for each frame
  const t0 = performance.now();
  (function tick() { if (!window.__frozen) seek((performance.now() - t0) / 1000); requestAnimationFrame(tick); })();
  </script>
</body>
</html>
